<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Mini E-commerce con Carrito de Off-White </title>

<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- TU CSS -->
<link rel="stylesheet" href="estiloss.css">

</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-dark">
  <div class="container">
    <span class="navbar-brand"> Mini E-commerce Off-White</span>
  </div>
</nav>

<div class="container my-4">

<h1 class="text-center mb-4">Tienda de Moda</h1>

<div class="row" id="productos"></div>

<hr>

<!-- CARRITO -->
<div class="card shadow">
<div class="card-header bg-dark text-white">
<h4>Carrito de compras</h4>
</div>

<div class="card-body">
<ul id="carrito"></ul>

<h4>Total: $<span id="total">0.00</span></h4>

<button class="btn btn-danger" onclick="vaciarCarrito()">Vaciar carrito</button>
</div>
</div>

</div>

<script>

// PRODUCTOS 
const productos = [
 {
 id: 1,
 nombre: "Playera Básica Off-White",
 precio: 15125.00,
 imagen: "playera.jpg"
 },
 {
 id: 2,
 nombre: "Hoddie Streetwear",
 precio: 12300.00,
 imagen: "sudadera.jpg"
 },
 {
 id: 3,
 nombre: "Tenis Off-White",
 precio: 25000.00,
 imagen: "tenis1.jpg"
 },
 {
 id: 4,
 nombre: "Gafas Off-White",
 precio: 2500.00,
 imagen: "gafas.jpg"
 },
 {
 id: 5,
 nombre: "Chamarra de Mezclilla Off-White",
 precio: 12800.00,
 imagen: "jacket.jpg"
 }
];

let carrito = [];

// MOSTRAR PRODUCTOS
function mostrarProductos(){
const contenedor = document.getElementById("productos");

productos.forEach(producto=>{
contenedor.innerHTML += `
<div class="col-md-3 mb-4">

<div class="minimal-card shadow-sm">

<img src="${producto.imagen}" class="img-producto">

<h5 class="mt-2">${producto.nombre}</h5>
<p>$${producto.precio}</p>

<input type="number" id="cantidad-${producto.id}" class="form-control mb-2" value="1" min="1">

<button class="btn btn-outline-dark w-100" onclick="agregarCarrito(${producto.id})">
Agregar
</button>

</div>

</div>
`;
});
}

// AGREGAR AL CARRITO
function agregarCarrito(id){

const producto = productos.find(p => p.id === id);

const cantidad = parseInt(document.getElementById(`cantidad-${id}`).value);

if(cantidad <= 0 || isNaN(cantidad)){
alert("Cantidad inválida");
return;
}

const existe = carrito.find(item => item.id === id);

if(existe){
existe.cantidad += cantidad;
}else{
carrito.push({...producto, cantidad});
}

mostrarCarrito();
}

// MOSTRAR CARRITO
function mostrarCarrito(){

const lista = document.getElementById("carrito");
const totalHTML = document.getElementById("total");

lista.innerHTML = "";

let total = 0;

carrito.forEach(item=>{

const subtotal = item.precio * item.cantidad;

total += subtotal;

lista.innerHTML += `
<li class="carrito-item">

<strong>${item.nombre}</strong><br>

Cantidad: ${item.cantidad}<br>

Subtotal: $${subtotal}

<br>

<button onclick="eliminarProducto(${item.id})">Eliminar</button>

</li>
`;
});

totalHTML.innerText = total.toFixed(2);
}

// ELIMINAR PRODUCTO
function eliminarProducto(id){

if(confirm("¿Eliminar producto?")){
carrito = carrito.filter(item => item.id !== id);
mostrarCarrito();
}


}

// VACIAR CARRITO
function vaciarCarrito(){
carrito = [];
mostrarCarrito();
}

// INICIO
mostrarProductos();

</script>

</body>
</html>
